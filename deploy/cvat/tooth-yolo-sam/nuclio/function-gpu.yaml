metadata:
  name: pth-tooth-yolo-sam-segment
  namespace: cvat
  annotations:
    name: Tooth YOLO + SAM Segmentation
    version: 2
    type: detector
    spec: |
      [
        { "id": 0, "name": "tooth", "type": "mask" }
      ]

spec:
  description: Detect teeth with YOLO11, then segment each tooth with SAM ViT-B on GPU
  runtime: python:3.10
  handler: main:handler
  eventTimeout: 180s
  env:
    - name: NVIDIA_VISIBLE_DEVICES
      value: all
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
    - name: YOLO_MODEL_PATH
      value: /opt/nuclio/best.pt
    - name: SAM_MODEL_PATH
      value: /opt/nuclio/sam_vit_b_01ec64.pth
    - name: MODEL_DEVICE
      value: cuda
    - name: IMG_SIZE
      value: "960"

  build:
    image: cvat.tooth.yolo_sam.segment:gpu
    baseImage: ubuntu:22.04
    directives:
      preCopy:
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
        - kind: WORKDIR
          value: /opt/nuclio
        - kind: RUN
          value: apt-get update && apt-get install -y git python3 python3-pip python-is-python3 libgl1 libglib2.0-0 && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: pip3 install torch==2.13.0 --index-url https://download.pytorch.org/whl/cu130 --no-cache-dir
        - kind: RUN
          value: pip3 install torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cu130 --no-cache-dir
        - kind: RUN
          value: pip3 install ultralytics numpy Pillow opencv-python-headless git+https://github.com/facebookresearch/segment-anything.git --no-cache-dir

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: http
      workerAvailabilityTimeoutMilliseconds: 180000
      attributes:
        maxRequestBodySize: 33554432

  resources:
    limits:
      nvidia.com/gpu: 1

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
